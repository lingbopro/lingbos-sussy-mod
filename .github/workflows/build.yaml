name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-fabric:
        description: 'URL to fabric build artifact'
        value: ${{ jobs.build.outputs.artifact-fabric }}
      artifact-neoforge:
        description: 'URL to neoforge build artifact'
        value: ${{ jobs.build.outputs.artifact-neoforge }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-fabric: ${{ steps.upload-fabric.outputs.artifact-url }}
      artifact-neoforge: ${{ steps.upload-neoforge.outputs.artifact-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: microsoft
      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build
      - name: Build fabric
        run: ./gradlew :fabric:build
      - name: Build neoforge
        run: ./gradlew :neoforge:build

      - name: Upload fabric build results
        id: upload-fabric
        uses: actions/upload-artifact@v4
        with:
          name: build-fabric
          path: fabric/build/libs/
      - name: Upload neoforge build results
        id: upload-neoforge
        uses: actions/upload-artifact@v4
        with:
          name: build-neoforge
          path: neoforge/build/libs/
